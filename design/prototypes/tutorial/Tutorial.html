<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Orbit — Tutorial Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Chango&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script type="module" src="https://cdn.jsdelivr.net/npm/ionicons@7.2.2/dist/ionicons/ionicons.esm.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  html, body {
    margin: 0; height: 100%;
    background: #0a0a18;
    font-family: 'Roboto', sans-serif;
    color: #e6ddc8;
    overflow: hidden;
  }
  #root {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 32px;
  }
  ion-icon { display: inline-flex; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="tokens.jsx"></script>
<script type="text/babel" src="TutorialSteps.jsx"></script>
<script type="text/babel" src="TutorialDemos.jsx"></script>
<script type="text/babel" src="TutorialModal.jsx"></script>

<script type="text/babel" data-presets="react">
  const DEFAULTS = /*EDITMODE-BEGIN*/{
    "mode": "first-run",
    "tone": "playful",
    "density": "cozy"
  }/*EDITMODE-END*/;

  function App() {
    const [t, setTweak] = window.useTweaks(DEFAULTS);
    const [open, setOpen] = React.useState(true);
    const c = window.orbitColors;

    return (
      <>
        <div style={{ position: 'relative' }}>
          <window.IOSDevice width={390} height={844} dark>
            {/* ProfileStub is visible behind the modal and after the modal closes */}
            <ProfileStub
              tone={t.tone}
              onReplay={() => { setTweak('mode', 'replay'); setOpen(true); }}
            />
            <window.TutorialModal
              open={open}
              onClose={() => setOpen(false)}
              mode={t.mode}
              tone={t.tone}
              density={t.density}
            />
          </window.IOSDevice>
        </div>

        <window.TweaksPanel title="Tweaks">
          <window.TweakSection label="Entry point">
            <window.TweakRadio
              label="Mode"
              value={t.mode}
              options={[
                { value: 'first-run', label: 'First run' },
                { value: 'replay',   label: 'Replay' },
              ]}
              onChange={v => setTweak('mode', v)}
            />
            <window.TweakButton label="Re-open tutorial" onClick={() => setOpen(true)} />
          </window.TweakSection>

          <window.TweakSection label="Copy & layout">
            <window.TweakRadio
              label="Tone"
              value={t.tone}
              options={[
                { value: 'playful', label: 'Playful' },
                { value: 'crisp',   label: 'Crisp' },
              ]}
              onChange={v => setTweak('tone', v)}
            />
            <window.TweakRadio
              label="Density"
              value={t.density}
              options={[
                { value: 'cozy',    label: 'Cozy' },
                { value: 'compact', label: 'Compact' },
              ]}
              onChange={v => setTweak('density', v)}
            />
          </window.TweakSection>
        </window.TweaksPanel>
      </>
    );
  }

  // Minimal profile screen — visible when the tutorial is closed, shows the
  // replay entry point so it's obvious how to re-trigger the tutorial.
  function ProfileStub({ tone, onReplay }) {
    const c = window.orbitColors;
    return (
      <div style={{
        background: c.bg, height: '100%',
        padding: '64px 20px 20px',
        fontFamily: 'Roboto, sans-serif',
        display: 'flex', flexDirection: 'column',
      }}>
        {/* Wordmark */}
        <div style={{
          fontFamily: 'Chango, cursive', fontSize: 52, color: c.text,
          textAlign: 'center', lineHeight: 1, marginBottom: 28,
        }}>orbit</div>

        {/* Avatar card */}
        <div style={{
          background: c.surface, borderRadius: 20, padding: 22,
          textAlign: 'center', border: `1px solid ${c.border}`, marginBottom: 20,
        }}>
          <div style={{
            width: 64, height: 64, borderRadius: 999,
            background: c.primary, color: '#fff',
            display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
            fontSize: 26, fontWeight: 700, marginBottom: 12,
          }}>M</div>
          <div style={{
            fontSize: 17, fontWeight: 700, color: c.text,
            fontFamily: 'Roboto Mono, monospace',
          }}>myles_h</div>
        </div>

        {/* Section label */}
        <div style={{
          fontSize: 11, fontFamily: 'Roboto Mono, monospace', fontWeight: 600,
          color: c.textTertiary, textTransform: 'uppercase', letterSpacing: 0.5,
          marginBottom: 8, marginLeft: 4,
        }}>Help</div>

        {/* Replay row */}
        <div
          onClick={onReplay}
          style={{
            background: c.surface, borderRadius: 16, padding: 16,
            border: `1px solid ${c.border}`,
            display: 'flex', alignItems: 'center', gap: 12, cursor: 'pointer',
          }}
        >
          <div style={{
            width: 36, height: 36, borderRadius: 10,
            background: 'rgba(107,95,212,0.18)',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
          }}>
            <ion-icon name="rocket-outline" style={{ color: c.primary, fontSize: 18 }} />
          </div>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 15, fontWeight: 600, color: c.text }}>
              {tone === 'playful' ? 'Replay the orbit tour' : 'Replay tutorial'}
            </div>
            <div style={{ fontSize: 12, color: c.textTertiary, marginTop: 2 }}>
              {tone === 'playful' ? '8 quick stops through the basics' : '8 steps · 2 min'}
            </div>
          </div>
          <ion-icon name="chevron-forward" style={{ color: c.textTertiary, fontSize: 16 }} />
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
